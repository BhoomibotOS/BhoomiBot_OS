name = "bhoomibot-os"
main = ".vercel/output/static/_worker.js/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true

[assets]
directory = ".vercel/output/static"

[durable_objects]
bindings = [{name = "RELAY", class_name = "RobotRelay"}]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RobotRelay"]
