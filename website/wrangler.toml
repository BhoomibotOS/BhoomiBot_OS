name = "bhoomibot"
main = "src/server/entry.ts"
compatibility_date = "2024-08-24"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true

[site]
bucket = ".vercel/output/static"

[durable_objects]
bindings = [{name = "RELAY", class_name = "RobotRelay"}]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RobotRelay"]
