name = "bhoomibot-os"
main = "worker.ts"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[durable_objects]
bindings = [{name = "RELAY", class_name = "RobotRelay"}]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RobotRelay"]
